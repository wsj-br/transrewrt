services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - poliverb-data:/app/data
    environment:
      - PORT=5000
      - CONFIG_PATH=/app/data/config.json
      # Pass API key from host (e.g. .env or: API_KEY=sk-... pnpm docker:up)
      - API_KEY=${API_KEY}

volumes:
  poliverb-data:
