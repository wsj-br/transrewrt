services:
  web:
    container_name: transrewrt
    build: .
    ports:
      - "5000:5000"
    volumes:
      - transrewrt-data:/app/data
    environment:
      - PORT=5000
      - CONFIG_PATH=/app/data/config.json
      # LLM keys (at minimum set OPENROUTER_KEY or another provider your models use)
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      - OPENAI_KEY=${OPENAI_KEY:-}
      - CEREBRAS_KEY=${CEREBRAS_KEY:-}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY:-}
      - GOOGLE_KEY=${GOOGLE_KEY:-}
      - DEEPSEEK_KEY=${DEEPSEEK_KEY:-}
      - GROQ_KEY=${GROQ_KEY:-}
      - MISTRAL_KEY=${MISTRAL_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - XAI_KEY=${XAI_KEY:-}

volumes:
  transrewrt-data:
