# Build and publish all deliverables: Windows NSIS, Linux AppImage (x64 + arm64), multi-arch Docker (GHCR).
# Trigger: GitHub Release published or manual workflow_dispatch (with optional 'tag_as_latest').
# Uses native runners (no QEMU): amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_as_latest:
        description: "Tag this build as 'latest' (only for manual runs)"
        required: false
        default: false
        type: boolean

env:
  REGISTRY_IMAGE: ghcr.io/wsj-br/transrewrt

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_version.outputs.version }}
      is_latest: ${{ steps.is_latest.outputs.is_latest }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get package.json version
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check if this is the latest release
        id: is_latest
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            CURRENT_TAG="${{ github.event.release.tag_name }}"
            LATEST_TAG=$(git tag -l --sort=-v:refname 2>/dev/null | head -1 || echo "")
            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" = "$CURRENT_TAG" ]; then
              echo "is_latest=true" >> $GITHUB_OUTPUT
              echo "This is the latest release ($CURRENT_TAG)"
            else
              echo "is_latest=false" >> $GITHUB_OUTPUT
              echo "This is not the latest release (current=$CURRENT_TAG, latest=$LATEST_TAG)"
            fi
          else
            if [ "${{ github.event.inputs.tag_as_latest }}" = "true" ]; then
              echo "is_latest=true" >> $GITHUB_OUTPUT
              echo "Manual run: tagging as latest (user requested)"
            else
              echo "is_latest=false" >> $GITHUB_OUTPUT
              echo "Manual run: not tagging as latest"
            fi
          fi

  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build and package
        run: pnpm run package

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-linux:
    name: Linux (AppImage, ${{ matrix.electron_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: x64
            runner: ubuntu-latest
          - electron_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - name: Install dependencies
        run: pnpm install

      - name: Build and package (Linux)
        run: pnpm run package -- --linux --${{ matrix.electron_arch }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.electron_arch }}
          path: release/*.AppImage

  build-docker:
    name: Docker (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set platform env
        run: |
          echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          echo "${digest#sha256:}" > "${{ runner.temp }}/digests/${{ env.PLATFORM_PAIR }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: "${{ runner.temp }}/digests"
          retention-days: 1

  merge-docker:
    name: Merge Docker manifest
    runs-on: ubuntu-latest
    needs: [prepare, build-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          IS_LATEST="${{ needs.prepare.outputs.is_latest }}"
          TAGS="-t ${{ env.REGISTRY_IMAGE }}:${VERSION}"
          if [ "$IS_LATEST" = "true" ]; then
            TAGS="$TAGS -t ${{ env.REGISTRY_IMAGE }}:latest"
          fi
          REFS=$(while read -r f; do [ -n "$f" ] && echo -n "${{ env.REGISTRY_IMAGE }}@sha256:$(cat "$f") "; done < <(find . -type f))
          docker buildx imagetools create $TAGS $REFS

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ needs.prepare.outputs.version }}
