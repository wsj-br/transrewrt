name: pnpm audit

on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday at 08:00 UTC
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit --fix
        run: pnpm audit --fix || true   # --fix writes overrides to pnpm-workspace.yaml

      - name: Reinstall after fix
        run: pnpm install

      - name: Open PR if lockfile changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(security): pnpm audit --fix'
          branch: chore/pnpm-audit-fix
          title: 'chore(security): fix vulnerable dependencies via pnpm audit'
          body: |
            Automated security fix generated by `pnpm audit --fix`.
            Review the changes in `pnpm-workspace.yaml` and `pnpm-lock.yaml` before merging.
          labels: dependencies, security

          