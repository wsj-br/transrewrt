# Build Linux AppImage for arm64 only (native ubuntu-24.04-arm). Use this to validate the arm64
# pipeline without Windows, Docker, or x64 AppImage jobs.

name: AppImage (Linux arm64)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/appimage-arm64.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "webpack.config.js"
      - "build/electron-builder.linux-arm64.json"
      - "src/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/appimage-arm64.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "webpack.config.js"
      - "build/electron-builder.linux-arm64.json"
      - "src/**"
      - "scripts/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  appimage-arm64:
    name: Linux AppImage (arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - name: Install dependencies
        run: pnpm install

      - name: Build AppImage (arm64)
        run: |
          pnpm run build
          node scripts/write-build-timestamp.js
          pnpm exec electron-builder --linux AppImage --arm64 --config build/electron-builder.linux-arm64.json

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: Transrewrt-AppImage-${{ steps.pkg.outputs.version }}-arm64-ci
          path: release/*.AppImage
