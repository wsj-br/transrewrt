# Build and deploy the Astro marketing site + docs (`website/`) to GitHub Pages.
# Triggers:
#   - pull_request (website/ paths): frozen install + build only (catch lockfile drift)
#   - workflow_dispatch: full build + deploy (manual or dispatched from Release on main)
# Release tag runs cannot deploy to the github-pages environment — only main is allowed.
#
# Repo Settings → Pages → Source must be "GitHub Actions".
# Live URL: https://wsj-br.github.io/transrewrt/

name: Deploy website (GitHub Pages)

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Build
        run: pnpm run build
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
