# Build unsigned macOS DMGs only (arm64 + x64) for validation.
# Does not publish a GitHub Release or Docker images.
# Trigger: workflow_dispatch.

name: macOS DMG

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (DMG, ${{ matrix.electron_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            runner: macos-latest
          - electron_arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build and package (macOS, ${{ matrix.electron_arch }})
        run: |
          pnpm run build
          pnpm run build:main
          node scripts/write-build-timestamp.js
          node scripts/electron-rebuild.js
          pnpm exec electron-builder --mac dmg --${{ matrix.electron_arch }} --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: Transrewrt-dmg-${{ matrix.electron_arch }}
          path: release/*.dmg
