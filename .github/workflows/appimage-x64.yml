# Build Linux AppImage for x64 (amd64) only. Use this to validate the x64 AppImage pipeline
# without Windows, Docker, or arm64 jobs.

name: AppImage (Linux x64)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  appimage-x64:
    name: Linux AppImage (x64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools fakeroot

      - name: Install dependencies
        run: pnpm install

      - name: Build AppImage (x64)
        run: |
          pnpm run build
          node scripts/write-build-timestamp.js
          pnpm exec electron-builder --linux AppImage --x64 --publish never

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: Transrewrt-AppImage-${{ steps.pkg.outputs.version }}-x64-ci
          path: release/*.AppImage
