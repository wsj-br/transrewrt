# Transrewrt production compose file
#
services:
  transrewrt:
    container_name: transrewrt
    ports:
      - "5000:5000"
    volumes:
      - transrewrt-data:/app/data
    networks:
      - transrewrt-network
    environment:
      - PORT=5000
      # LLM keys (at minimum set OPENROUTER_API_KEY or another provider your models use)
      #- OPENROUTER_API_KEY=
      #- OPENAI_API_KEY=
      #- CEREBRAS_API_KEY=
      #- ANTHROPIC_API_KEY=
      #- GOOGLE_API_KEY=
      #- DEEPSEEK_API_KEY=
      #- GROQ_API_KEY=
      #- MISTRAL_API_KEY=
      #- XAI_API_KEY=
      #- OLLAMA_URL=

networks:
  transrewrt-network:
    driver: bridge

volumes:
  transrewrt-data:
