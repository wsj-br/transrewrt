# Transrewrt production compose file
#
services:
  transrewrt:
    image: ghcr.io/wsj-br/transrewrt:latest
    container_name: transrewrt
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - transrewrt-data:/app/data
    networks:
      - transrewrt-network
    environment:
      - PORT=5000
      - TZ=${TZ:-Europe/London}
      # LLM API keys (you must set at least one provider key for the app to function)
      - OPENROUTER_API_KEY
      - OPENAI_API_KEY
      - CEREBRAS_API_KEY
      - ANTHROPIC_API_KEY
      - GOOGLE_API_KEY
      - DEEPSEEK_API_KEY
      - GROQ_API_KEY
      - MISTRAL_API_KEY
      - XAI_API_KEY
      - LOCAL_LLM_URL
      - CUSTOM_PROVIDER_NAME
      - CUSTOM_PROVIDER_URL
      - CUSTOM_PROVIDER_API_KEY

    # LLM API keys from .env file (optional/alternative to environment variables)
    # env_file:
    #   - .env

networks:
  transrewrt-network:
    driver: bridge

volumes:
  transrewrt-data:
