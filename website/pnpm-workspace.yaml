# Independent workspace root for the marketing/docs site.
# Decoupled from the parent Electron/webpack toolchain — never use `pnpm -w` from here.
allowBuilds:
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# Fresh publishes still within pnpm 11's default minimumReleaseAge window.
minimumReleaseAgeExclude:
  - ai-i18n-tools@1.8.3
  - electron-to-chromium@1.5.396
  - postcss@8.5.23
  - remark-smartypants@3.0.3
  - sax@1.6.1
