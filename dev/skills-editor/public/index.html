<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transrewrt skills editor (dev)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="editor-server-down-overlay" class="hidden overlay" aria-hidden="true">
      <div class="overlay-card">
        <p><strong>Skills editor server unreachable.</strong></p>
        <p>Run from repo root: <code>pnpm run dev:skills-editor</code></p>
        <button type="button" id="editor-server-down-close">Close</button>
      </div>
    </div>

    <header class="topbar">
      <div class="topbar-row topbar-title-row">
        <h1>Transrewrt — skills.json (dev)</h1>
        <div class="topbar-actions">
          <span id="status-line" class="status-line"></span>
          <button type="button" id="btn-reload" class="btn secondary">Reload</button>
          <button type="button" id="btn-save-catalog" class="btn primary">Save catalog</button>
        </div>
      </div>
      <div class="topbar-row topbar-translate-row">
        <div class="header-model-group">
          <span class="header-model-label">Translation model (translate missing)</span>
          <div class="header-model-row">
            <code id="display-translation-model" class="header-model-display"></code>
            <button type="button" id="btn-pick-translation-model" class="btn secondary sm">
              Choose…
            </button>
          </div>
        </div>
        <div class="header-model-group">
          <span class="header-model-label">Translation model — Fallback</span>
          <div class="header-model-row">
            <code id="display-translation-model-fallback" class="header-model-display"></code>
            <button type="button" id="btn-pick-translation-model-fallback" class="btn secondary sm">
              Choose…
            </button>
          </div>
        </div>
        <div class="header-translate-actions">
          <button type="button" id="btn-translate-missing" class="btn">Translate missing</button>
          <span id="translate-missing-hint" class="translate-missing-hint muted"></span>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel list-panel">
        <div class="toolbar">
          <input type="search" id="skill-search" placeholder="Search skills…" />
          <button type="button" id="btn-add-skill" class="btn secondary">Add skill</button>
        </div>
        <ul id="skill-list" class="skill-list"></ul>
      </aside>

      <section class="panel detail-panel" id="detail-panel">
        <p class="empty-state" id="detail-empty">Select a skill from the list.</p>

        <div id="detail-form" class="hidden">
          <div class="detail-header">
            <h2 id="detail-title"></h2>
            <div class="detail-actions">
              <button type="button" id="btn-delete-skill" class="btn danger">Delete skill</button>
            </div>
          </div>

          <div class="detail-split">
            <div class="detail-left">
              <div class="form-grid">
                <label>id <input type="text" id="field-id" autocomplete="off" /></label>
                <label class="span-2"
                  >name <span id="label-name-source-locale" class="muted">(en-GB)</span>
                  <input type="text" id="field-name" autocomplete="off"
                /></label>
                <label class="span-2"
                  >description <span id="label-description-source-locale" class="muted">(en-GB)</span>
                  <textarea id="field-description" rows="4"></textarea>
                </label>
                <label class="span-2"
                  >prompt_hint
                  <textarea id="field-prompt-hint" rows="4"></textarea>
                </label>
                <label class="span-2 model-id-field"
                  >model_id
                  <span class="model-id-row">
                    <input type="text" id="field-model-id" readonly placeholder="Pick a model…" />
                    <button type="button" id="btn-change-model" class="btn secondary">
                      Change
                    </button>
                    <button type="button" id="btn-test-model" class="btn">Test model</button>
                  </span>
                </label>
                <p id="test-model-result" class="test-result span-2 model-test-result" aria-live="polite"></p>
              </div>
            </div>

            <div class="detail-right">
              <div id="translations-panel" class="translations-panel">
                <h3>Translations</h3>
                <div id="translations-tables"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div
      id="model-picker-overlay"
      class="overlay model-picker-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="model-picker-title"
      aria-hidden="true"
    >
      <div class="model-picker-modal">
        <div class="model-picker-header">
          <h2 id="model-picker-title">Select model</h2>
          <button type="button" id="model-picker-close" class="btn secondary">Close</button>
        </div>
        <p id="model-picker-hint" class="muted model-picker-hint"></p>
        <div class="models-toolbar">
          <input type="search" id="model-modal-search" placeholder="Search models…" />
          <button type="button" id="btn-modal-expand-all" class="btn secondary sm">Expand all</button>
          <button type="button" id="btn-modal-collapse-all" class="btn secondary sm">Collapse all</button>
        </div>
        <div id="model-modal-list" class="model-list model-list-modal"></div>
      </div>
    </div>

    <div
      id="translate-progress-overlay"
      class="overlay translate-progress-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="translate-progress-title"
      aria-hidden="true"
      data-run-done="0"
    >
      <div class="translate-progress-modal">
        <div class="translate-progress-header">
          <h2 id="translate-progress-title">Translating missing fields</h2>
          <button type="button" id="translate-progress-close" class="btn secondary" disabled>
            Close
          </button>
        </div>
        <p id="translate-progress-summary" class="translate-progress-summary muted"></p>
        <div id="translate-progress-log" class="translate-progress-log" aria-live="polite"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
