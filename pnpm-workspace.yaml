allowBuilds:
  argon2: true
  better-sqlite3: true
  core-js-pure: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  puppeteer: true
  sharp: true

allowedDeprecatedVersions:
  prebuild-install: 7.1.3

minimumReleaseAgeExclude:
  - concurrently@10.0.0
  - license-checker-rseidelsohn@5.0.1
  - lucide-react@1.17.0 || 1.21.0
  - webpack-cli@7.0.3
  - electron@42.4.1 || 43.1.1
  - ai-i18n-tools@1.6.1 || 1.7.1
  - "@ai-sdk/openai-compatible@3.0.10"
  - "@ai-sdk/provider-utils@5.0.10"
  - "@ai-sdk/gateway@4.0.20"
  - ai@7.0.28

# GHSA-64mm-vxmg-q3vj (http-proxy-middleware router host+path bypass) is fixed
# upstream in 2.0.10, 3.0.6 and 4.1.0. webpack-dev-server@5 calls the v2
# createProxyMiddleware(context, options) API, so we must stay on the patched v2
# backport 2.0.10 (see overrides below). The npm advisory range pnpm audit reads
# collapses to "<3.0.6", so it flags the genuinely-patched 2.0.10 as vulnerable;
# ignore that single advisory so audit stays green and `audit --fix override`
# does not re-bump us to the API-incompatible v3 line.
auditConfig:
  ignoreGhsas:
    - GHSA-64mm-vxmg-q3vj

overrides:
  tmp: ^0.2.6
  next: '>=16.2.6'
  yauzl: '>=3.2.1'
  rimraf: ^5.0.0
  glob: ^13.0.0
  global-agent: ^4.1.2
  qs: '>=6.14.2'
  minimatch: '>=10.2.1'
  lodash: '>=4.18.0'
  '@xmldom/xmldom': '>=0.8.13'
  uuid: '>=14.0.0'
  postcss: '>=8.5.10'
  js-yaml: ^4.2.0
  http-proxy-middleware@>=0.16.0 <2.0.10: ^2.0.10

peerDependencyRules:
  allowedVersions:
    webpack-dev-server: "6"
