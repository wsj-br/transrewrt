# GHSA-64mm-vxmg-q3vj (http-proxy-middleware router host+path bypass) is fixed
# upstream in 2.0.10, 3.0.6 and 4.1.0. webpack-dev-server@5 calls the v2
# createProxyMiddleware(context, options) API, so we must stay on the patched v2
# backport 2.0.10 (see overrides below). The npm advisory range pnpm audit reads
# collapses to "<3.0.6", so it flags the genuinely-patched 2.0.10 as vulnerable;
# ignore that single advisory so audit stays green and `audit --fix override`
# does not re-bump us to the API-incompatible v3 line.
auditConfig:
  ignoreGhsas:
    - GHSA-64mm-vxmg-q3vj

overrides:
  tmp: ^0.2.6
  next: '>=16.2.6'
  yauzl: '>=3.2.1'
  rimraf: ^5.0.0
  glob: ^13.0.6
  global-agent: ^4.1.2
  qs: '>=6.14.2'
  minimatch: '>=10.2.1'
  lodash: '>=4.18.0'
  # plist@3.1.0 (electron-builder macOS Info.plist) calls parseFromString without a mimeType.
  # @xmldom/xmldom 0.9 requires one and breaks `electron-builder --mac`. Stay on patched 0.8.x.
  '@xmldom/xmldom': '>=0.8.13 <0.9.0'
  uuid: '>=14.0.0'
  postcss: '>=8.5.10'
  js-yaml: ^4.2.0
  http-proxy-middleware@>=0.16.0 <2.0.10: ^2.0.10
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  compression@<1.8.2: ^1.8.2
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  http-cache-semantics@<=4.2.0: ^4.3.0
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8
  serialize-javascript@>=7.1.1 <7.1.2: ^7.1.2
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@<6.28.1: ^6.28.1
  undici@>=7.0.0 <7.29.1: ^7.29.1

peerDependencyRules:
  allowedVersions:
    webpack-dev-server: "6"
    eslint: "10"
